<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 521 561" role="img" aria-label="余晖小居规划户型：入户直接进入右侧客厅，西北主卧带独享主卫，主卧外公卫由客厅进入；北侧为小书房与厨房，西南次卧，南侧阳台"><style>.plan-room rect { stroke: rgb(110, 120, 101); stroke-width: 2.5; }
.plan-room.is-current rect { fill: rgb(203, 217, 187); }
.plan-room text { text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.plan-room-name { fill: rgb(62, 75, 56); font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: 20px; letter-spacing: 4px; }
.plan-small-name { font-size: 15px; letter-spacing: 2px; }
.plan-room-size { font-size: 11px; fill: rgb(98, 107, 88); letter-spacing: 0.2px; }
.plan-room-area { font-size: 10px; fill: rgb(146, 145, 127); }
.plan-door path { fill: none; stroke: rgb(99, 113, 83); stroke-width: 1.2; }
.plan-door.is-planned path { stroke: rgb(148, 140, 116); stroke-dasharray: 3, 2; }
.plan-door path.plan-door-gap { stroke: rgb(245, 241, 232); stroke-width: 5; stroke-dasharray: none; }
.plan-dimensions path, .plan-north path, .plan-scale path { fill: none; stroke: rgb(152, 149, 129); stroke-width: 1; }
.plan-dimensions text, .plan-north text, .plan-scale text { text-anchor: middle; font-size: 11px; fill: rgb(132, 133, 112); letter-spacing: 1px; }
.plan-entry { text-anchor: middle; font-size: 9px; fill: rgb(157, 144, 117); letter-spacing: 1px; }
.plan-open-area { text-anchor: middle; font-size: 9px; fill: rgb(148, 145, 126); letter-spacing: 1px; }</style>
