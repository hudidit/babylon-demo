<circle cx="443.0" cy="427.1" r="4" fill="#283932"/>
<text x="452.0" y="432.1" font-size="14">住宅</text>
<circle cx="123.5" cy="634.4" r="4" fill="#283932"/>
<text x="132.5" y="639.4" font-size="14">灯塔</text>
<circle cx="258.2" cy="475.1" r="4" fill="#283932"/>
<text x="267.2" y="480.1" font-size="14">观景台</text>
<text x="502" y="112" font-size="15">北 ↑</text>
<text x="372" y="681" font-size="15" fill="#55747e">海</text>
<text x="44" y="728" font-size="13">虚线：现有可走区域　棕线：步道控制点示意</text>
<text x="44" y="751" font-size="13">色块：景观设计范围，最终实例须逐一校验支撑与界外余量</text>
<text x="590" y="115" font-size="21" font-weight="500">A　屋后风剪松林</text>
<text x="590" y="143" font-size="14" fill="#617269">4–7米</text>
<text x="590" y="169" font-size="15">不规则林团与低灌木，给住宅背后建立深色背景。</text>
<text x="590" y="227" font-size="21" font-weight="500">B　中段草甸与岩脊</text>
<text x="590" y="255" font-size="14" fill="#617269">草0.4–0.8米 / 岩1–3米</text>
<text x="590" y="281" font-size="15">以大片草甸留白，穿插两三组低岩脊和小树团。</text>
<text x="590" y="339" font-size="21" font-weight="500">C　塔后低矮疏林</text>
<text x="590" y="367" font-size="14" fill="#617269">2–5米</text>
<text x="590" y="393" font-size="15">树冠从内陆向海岸降低，保留灯塔完整轮廓与航标视线。</text>
<text x="590" y="451" font-size="21" font-weight="500">D　临海岬角草坡</text>
<text x="590" y="479" font-size="14" fill="#617269">灌木0.3–0.8米 / 岩0.6–1.5米</text>
<text x="590" y="505" font-size="15">以风压草丛、贴地灌木和顺地层岩块丰富侧方岩岬。</text>
<text x="590" y="563" font-size="21" font-weight="500">E　远处林丘背景</text>
<text x="590" y="591" font-size="14" fill="#617269">丘体8–16米 / 林冠4–8米</text>
<text x="590" y="617" font-size="15">以两三层低缓林丘收住远景，覆盖大片单色腹地；轮廓高度按</text>
<text x="590" y="639" font-size="15">现有镜头复核。</text>
<text x="590" y="719" font-size="14" font-weight="500">先做 A + E，解决屋后与远景的大面积空白。</text>
<text x="590" y="745" font-size="13" fill="#617269">范围依据项目坐标；不是完整岛形或可进入的新区域。</text>
</g></svg>
