  <rect x="32" y="126" width="900" height="610" rx="18" fill="none" stroke="#c5cec2"/>

  <g transform="translate(954 126)">
    <rect width="294" height="610" rx="18" fill="#eeece2"/>
    <text x="22" y="35" font-size="18" font-weight="700">一段有目的地的散步</text>
    <text x="22" y="65" class="body">从家里发现远处的白塔，</text>
    <text x="22" y="88" class="body">沿着海岸，亲自走到那里。</text>
    <path d="M22 111H272" stroke="#d1d3c4"/>
    <text x="22" y="141" class="cardTitle">01 远方地标</text>
    <text x="22" y="167" class="body">西南岬角 · 暖白塔身</text>
    <text x="22" y="190" class="body">塔高18～22米</text>
    <text x="22" y="213" class="body">基座位于真实崖顶陆地</text>
    <path d="M22 235H272" stroke="#d1d3c4"/>
    <text x="22" y="265" class="cardTitle">02 连续步道</text>
    <text x="22" y="291" class="body">路线约190～230米</text>
    <text x="22" y="314" class="body">路宽1.6～2.0米</text>
    <text x="22" y="337" class="body">草地缓冲 · 临崖护栏</text>
    <path d="M22 359H272" stroke="#d1d3c4"/>
    <text x="22" y="389" class="cardTitle">03 首期抵达体验</text>
    <text x="22" y="415" class="body">塔前观景与绕塔</text>
    <text x="22" y="438" class="body">全程步行往返</text>
    <text x="22" y="461" class="body">塔内与登塔留待后续</text>
    <path d="M22 483H272" stroke="#d1d3c4"/>
    <text x="22" y="514" class="small muted">图上西为左；阳台朝南看海时，</text>
    <text x="22" y="535" class="small muted">灯塔在右前方，需稍向右转头。</text>
    <text x="22" y="568" class="small muted">原创SVG概念示意 · 2026-10-18</text>
    <text x="22" y="589" class="small muted">未开发 · 非运行截图 · 非建筑规范</text>
  </g>
  <text x="32" y="773" class="small muted">浅色带表示步道附近的探索余地，非精确可行走边界。海岸形状与全部尺寸均以灰盒验证后的方案更新为准。</text>
</svg>
