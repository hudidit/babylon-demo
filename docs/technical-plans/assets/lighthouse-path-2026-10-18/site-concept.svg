    <text x="832" y="193" class="label">房屋</text>
    <text x="867" y="237" class="small">A 家门</text>
    <text x="823" y="176" class="small">B</text><text x="779" y="176" class="small">C</text>
    <text x="689" y="247" class="label">D 海岸入口</text>
    <text x="608" y="277" class="small">E 沿崖转弯</text>
    <text x="469" y="293" class="label">F 观景点</text>
    <text x="469" y="351" class="small">朝海长椅 · 可回望房屋</text>
    <text x="320" y="382" class="label">G 岬角缓坡</text>
    <text x="231" y="458" class="label">H 灯塔引道</text>
    <path d="M274 597 300 623H393" fill="none" stroke="#425755" stroke-width="1"/>
    <text x="303" y="646" class="label">I 灯塔前场</text>
    <text x="303" y="667" class="small">绕塔 · 看海 · 回望来路</text>
    <text x="718" y="455" class="small">保留近宅岩岬</text>
    <text x="552" y="153" class="small muted">虚线：现有近岸西边界</text>
    <path d="M652 156 664 165" stroke="#6e7a6e" fill="none"/>
    <text x="112" y="194" font-size="17" fill="#657860" letter-spacing="4">内陆草坡</text>
    <text x="657" y="573" font-size="28" fill="#f3f5ee" letter-spacing="12" opacity=".8">大海</text>
    <text x="506" y="490" class="small" transform="rotate(-30 506 490)" fill="#3f6870">阳台 → 灯塔约154米</text>

    <g transform="translate(883 655)">
      <path d="M0 26V-8" stroke="#304d4b" stroke-width="1.5"/>
      <path d="M0-13-4-3H4Z" fill="#304d4b"/>
      <text x="0" y="-25" text-anchor="middle" font-size="15" font-weight="700">N</text>
    </g>
    <g transform="translate(57 702)">
      <path d="M0 0H172M0-5V5M172-5V5" stroke="#425755" stroke-width="1.5"/>
      <text x="0" y="20" class="small">0</text><text x="172" y="20" text-anchor="end" class="small">40米</text>
