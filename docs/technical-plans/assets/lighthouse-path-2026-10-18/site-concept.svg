<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">悬崖灯塔与沿海步道俯视概念图</title>
  <desc id="description">北向朝上。房屋位于右上，灯塔在西南侧约154米远的岬角。玩家从房屋东侧入户门出门，绕屋后沿崖顶步道，经过一处观景点，抵达灯塔前场。路线控制折线约190米，规划平滑路线190至230米。图为待实施设计，不是现状或运行截图。</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#b0d0d3"/><stop offset="1" stop-color="#729eac"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#d8dcc3"/><stop offset="1" stop-color="#b8c6a4"/>
    </linearGradient>
    <clipPath id="mapClip"><rect x="32" y="126" width="900" height="610" rx="18"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #263c39; }
      .muted { fill: #66736a; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .cardTitle { font-size: 15px; font-weight: 700; }
      .node { fill: #fffaf0; stroke: #a86e43; stroke-width: .55; }
      .coast { fill: none; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1280" height="800" fill="#f6f3ec"/>
  <text x="32" y="48" font-size="28" font-weight="700">走向海角的灯塔</text>
  <text x="32" y="79" font-size="15" class="muted">房屋 · 崖顶步道 · 观景点 · 灯塔前场</text>
  <rect x="1092" y="28" width="156" height="34" rx="17" fill="#e8deca"/>
  <text x="1170" y="50" text-anchor="middle" font-size="13" font-weight="600">设计方案 / 待实施</text>
  <text x="32" y="110" font-size="12" class="muted">俯视概念图：坐标沿用户型米制约定；新岸线、路线与视线均待灰盒校准。</text>

