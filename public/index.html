<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>余晖书房 · Babylon.js</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #242c2e; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #gameCanvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #interaction-reticle { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; transform: translate(-50%, -50%); border-radius: 50%; background: #fff7e8e6; box-shadow: 0 0 0 1px #30291a80, 0 1px 5px #0005; z-index: 20; pointer-events: none; transition: width 120ms, height 120ms, background 120ms; }
      #interaction-reticle.has-target { width: 9px; height: 9px; background: #eacb90; }
      #interaction-hint { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); z-index: 20; padding: 6px 10px; border-radius: 5px; background: #242c2eb3; color: #fff2dd; font-size: 11px; letter-spacing: 1px; white-space: nowrap; pointer-events: none; }
      .identity { position: fixed; top: 30px; left: 32px; z-index: 10; color: #f2e8d4; pointer-events: none; }
      .eyebrow { color: #c5aa78; font-size: 10px; letter-spacing: 3px; margin: 0 0 10px; }
      h1 { font-weight: 400; font-size: 29px; letter-spacing: 5px; margin: 0 0 10px; }
      #scene-status { color: #c0c4bb; font-size: 11px; letter-spacing: 1px; margin: 0; }
      .view-controls { position: fixed; right: 26px; bottom: 26px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 52px); padding: 6px; z-index: 10; background: #eee5d5; border-radius: 10px; box-shadow: 0 5px 25px #0003; }
      button { font: inherit; cursor: pointer; }
      .view-controls button { color: #56564b; border: 0; background: transparent; padding: 10px 16px; border-radius: 6px; font-size: 12px; }
      .view-controls button[aria-pressed="true"] { background: #73503d; color: #fff2dd; }
      .view-controls button:hover { background: #d9cbb6; color: #342c23; }
      .view-controls button[aria-pressed="true"]:hover { background: #73503d; color: #fff2dd; }
      button:focus-visible, input:focus-visible { outline: 2px solid #d4ad68; outline-offset: 3px; }
      .help { position: fixed; left: 32px; bottom: 34px; color: #b9bdb4; z-index: 10; font-size: 11px; letter-spacing: 1px; pointer-events: none; }
      .tools { position: fixed; right: 28px; top: 28px; z-index: 10000; display: flex; gap: 8px; }
      .tools button { border: 1px solid #a7ad9955; color: #c5c9bf; background: #242c2eaa; padding: 7px 12px; border-radius: 6px; font-size: 11px; }
      .tools button[aria-expanded="true"] { background: #73503d; color: #fff2dd; }
      .settings-panel { position: fixed; top: 74px; right: 28px; width: min(300px, calc(100% - 36px)); z-index: 10000; color: #40392f; background: #eee5d5; padding: 20px; border-radius: 10px; box-shadow: 0 8px 32px #0005; }
      .settings-header, .setting-label, .speed-scale { display: flex; align-items: center; justify-content: space-between; }
      .settings-header { margin-bottom: 22px; }
      .settings-header h2 { font-size: 15px; font-weight: 500; margin: 0; }
      #settings-close { border: 0; background: transparent; color: #56564b; font-size: 20px; padding: 0 4px; }
      .setting-label { font-size: 12px; margin-bottom: 12px; }
      #movement-speed-value { font-variant-numeric: tabular-nums; color: #73503d; }
      #movement-speed { display: block; width: 100%; margin: 0; accent-color: #73503d; cursor: pointer; }
      .speed-scale { font-size: 10px; color: #776d5e; margin-top: 7px; }
      #movement-speed-description { font-size: 11px; color: #776d5e; line-height: 1.7; margin: 16px 0; }
      #settings-reset { border: 1px solid #cbbca6; border-radius: 6px; background: transparent; color: #56564b; padding: 7px 10px; font-size: 11px; }
      @media (max-width: 640px) { .identity { left: 18px; top: 20px; } h1 { font-size: 23px; } .view-controls { right: 12px; bottom: 16px; left: 12px; max-width: none; justify-content: center; } .view-controls button { padding: 10px; } .help { display: none; } .tools { top: 20px; right: 18px; } .settings-panel { top: 64px; right: 18px; } }
    </style>
  </head>
  <body>
    <div class="identity">
      <p class="eyebrow">THE AFTERNOON STUDY</p>
      <h1>余晖书房</h1>
      <p id="scene-status" role="status">正在布置书房…</p>
    </div>
    <nav class="tools" aria-label="场景工具">
      <button id="settings-btn" aria-expanded="false" aria-controls="settings-menu">设置</button>
      <button id="inspect-btn">调试</button>
    </nav>
    <section id="settings-menu" class="settings-panel" aria-labelledby="settings-title" hidden>
      <div class="settings-header">
        <h2 id="settings-title">设置</h2>
        <button id="settings-close" aria-label="关闭设置">×</button>
      </div>
      <div class="setting-label">
        <label for="movement-speed">移动速度</label>
        <output id="movement-speed-value" for="movement-speed">1.00×</output>
      </div>
      <input id="movement-speed" type="range" min="0.25" max="3" step="0.25" value="1" aria-describedby="movement-speed-description" />
      <div class="speed-scale" aria-hidden="true"><span>慢 · 0.25×</span><span>快 · 3.00×</span></div>
      <p id="movement-speed-description">调节第一人称视角中方向键 / WASD 的移动速度，立即生效并自动保存。</p>
      <button id="settings-reset">恢复默认</button>
    </section>
    <div class="help" id="view-help">拖动旋转 · 滚轮缩放 · 右键平移</div>
    <div id="interaction-reticle" aria-hidden="true" hidden></div>
    <div id="interaction-hint" role="status" hidden></div>
    <nav class="view-controls" aria-label="场景视角">
      <button data-view="overview" aria-pressed="true">房间全景</button>
      <button data-view="reading" aria-pressed="false">阅读区</button>
      <button data-view="desk" aria-pressed="false">书桌</button>
      <button data-view="details" aria-pressed="false">桌面细节</button>
      <button data-view="cabinet" aria-pressed="false">藏书角</button>
      <button data-view="first-person" aria-pressed="false">第一人称</button>
    </nav>
  </body>
</html>
